services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: fieldops, POSTGRES_PASSWORD: fieldops, POSTGRES_DB: fieldops }
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U fieldops"], interval: 5s, retries: 10 }
  api:
    build: .
    env_file: .env
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
volumes: { dbdata: {} }
